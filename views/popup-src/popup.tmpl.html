         that rule: its real clock and real zero are plotted as a marked floor,
         while unread has no y value and stays off the frame. A presumed window
         has no sample history, so its one mark gets no synthesized trail. */
      const plottable = window.used_percent != null && !rolled(window)
        && !state.unknown && at != null && Boolean(window.resets_at);
      const position = plottable ? [Math.round(at * 100) / 100, window.used_percent] : null;
      if (plottable && !window.presumed) {
        const live = position;
        if (!trail.length || Math.abs(trail[trail.length - 1][0] - live[0]) > .05
            || trail[trail.length - 1][1] !== live[1]) trail.push(live);
        samples.push({ at: Date.now(), e: live[0], u: live[1] });
      }
      entries.push({ account, window, session, fable: isFable(window), trail, samples,
                     plottable, lastKnown: state.lastKnown, at, position });
    }
  }
  // The register is an approach order, not a heat map: family first, snapshot
  // account order inside Anthropic, and the weekly budget before its throttle.
  return entries;
}

function renderPlot() {
  const svg = document.getElementById("ils");
  const frame = document.querySelector(".plot-frame");
  const register = document.getElementById("plot-register");
  svg.textContent = "";
  register.textContent = "";

  const entries = plotEntries();
  fillRegister(register, entries);
  /* Measure AFTER the register is in the DOM. The register is the flex sibling
     that decides how much room is left, so a frame measured before it lands is
     measured against a box that no longer exists — and the SVG, whose viewBox
     then no longer matches its element, quietly letterboxes itself into the
     middle of the glass instead of filling it. */
  const VW = Math.round(frame.clientWidth), VH = Math.round(frame.clientHeight);
  if (!(VW > 0 && VH > 0)) return;
  svg.setAttribute("viewBox", `0 0 ${VW} ${VH}`);

  const mk = (tag, attrs, text, parent = svg) => {
    const node = document.createElementNS(NSVG, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (text != null) node.textContent = text;
    parent.appendChild(node);
    return node;
  };
  /* the left gutter holds the widest y tick — "100%", four 9px monospace glyphs
     with .08em tracking ≈ 25px — plus the 6px the label stands off the frame.
     30 was cut for the bare number and would push the % sign off the glass. */
  const M = { l: 36, r: 14, t: 14, b: 26 };
  const W = VW - M.l - M.r, H = VH - M.t - M.b;
  const x = e => M.l + e / 100 * W, y = u => M.t + (100 - u) / 100 * H;
  const defs = mk("defs", {});
  const arrow = mk("marker", { id: "projection-arrow", markerWidth: 6, markerHeight: 6,
    refX: 5, refY: 3, orient: "auto", markerUnits: "userSpaceOnUse" }, null, defs);
  mk("path", { d: "M0,0 L6,3 L0,6 Z", fill: "var(--significant)" }, null, arrow);

  mk("rect", { x: M.l, y: M.t, width: W, height: H, rx: 4, class: "ils-frame" });
  for (const value of [25, 50, 75]) {
    mk("line", { x1: x(value), x2: x(value), y1: M.t, y2: M.t + H, class: "ils-grid" });
    mk("line", { x1: M.l, x2: M.l + W, y1: y(value), y2: y(value), class: "ils-grid" });
  }
  mk("line", { x1: x(0), y1: y(0), x2: x(100), y2: y(100), class: "ils-beam-glow" });
  mk("line", { x1: x(0), y1: y(0), x2: x(100), y2: y(100), class: "ils-beam" });
  mk("text", { x: M.l + W / 2, y: VH - 3, "text-anchor": "middle", class: "ils-axis" },
     "WINDOW ELAPSED →");
  /* both axes are percent of the window, so both tick sets say so — a bare 50
     on a frame whose every other readout carries % is the one number the eye
     has to translate */
  for (const value of [0, 50, 100]) {
    mk("text", { x: M.l - 6, y: y(value) + 3, "text-anchor": "end", class: "ils-axis" }, `${value}%`);
    mk("text", { x: x(value), y: M.t + H + 14, "text-anchor": "middle", class: "ils-axis" }, `${value}%`);
  }

  for (const entry of entries) {
    if (!entry.plottable || entry.trail.length < 2) continue;
    const markId = `${entry.account.display}/${entry.window.meter_id}`;
    const path = entry.trail
      .map(([e, u], index) => `${index ? "L" : "M"}${x(e).toFixed(1)},${y(u).toFixed(1)}`).join(" ");
    mk("path", { d: path, class: `ils-trail ${entry.session ? "session" : "weekly"}${entry.fable ? " fable" : ""}`,
                 "data-mark": markId, "data-provider": entry.account.provider,
                 "data-class": classOf(entry), stroke: colorFor(entry.account.display) });
  }
  for (const entry of entries) {
    if (!entry.plottable) continue;
    const [e, u] = entry.position;
    const capped = entry.window.used_percent >= 99.5;
    const colour = capped ? "var(--significant)" : colorFor(entry.account.display);
    const markId = `${entry.account.display}/${entry.window.meter_id}`;
    const loggedIn = isHere(entry.account), remote = isThere(entry.account);
    const group = mk("g", { class: `ils-mark ${entry.session ? "session" : "weekly"}`
      + (entry.fable ? " fable" : "")
      + (entry.lastKnown ? " last-known" : "")
      + (entry.window.presumed ? " presumed" : "")
      + (loggedIn ? " logged-in" : ""),
      "data-mark": markId, "data-provider": entry.account.provider, "data-class": classOf(entry),
      "data-elapsed": e.toFixed(1), "data-used": Math.round(u).toString() });
    /* the meter badge: outline = window class, letter = account, both in the
       account's hue (red once capped) */
    const [tag, attrs, dy] = badgeOutline(badgeShape(entry.window, entry.session), x(e), y(u), 8.5);
    mk(tag, { ...attrs, class: `ils-badge ${entry.session ? "ils-throttle session" : "ils-budget"}`
      + (entry.fable ? " fable" : ""), style: `stroke:${colour}` }, null, group);
    mk("text", { x: x(e), y: y(u) + dy, class: "ils-badge-letter", style: `fill:${colour}` },
       badgeLetter(entry.account.display), group);
    /* the one mark that says "you are here" — a ring of pure ink, drawn outside
       the symbol so it neither recolours it nor changes its size */
    if (loggedIn) mk("circle", { cx: x(e), cy: y(u), r: 15, class: "ils-loggedin-ring" },
                     null, group);
    /* the same ring said quieter: this one is being flown from another satellite */
    else if (remote) mk("circle", { cx: x(e), cy: y(u), r: 15, class: "ils-remote-ring" },
                        null, group);
    const reticle = mk("g", { class: "selection-reticle", "data-mark": markId,
      "data-provider": entry.account.provider, "data-class": classOf(entry),
      "data-elapsed": `${e.toFixed(1)}%`, "data-used": `${Math.round(u)}%` });
    mk("line", { x1: x(e), y1: y(u), x2: x(e), y2: M.t + H }, null, reticle);
    mk("line", { x1: M.l, y1: y(u), x2: x(e), y2: y(u) }, null, reticle);
    mk("circle", { cx: x(e), cy: y(u), r: 9, class: "reticle-ring" }, null, reticle);
    mk("text", { x: x(e), y: VH - 7, "text-anchor": "middle", class: "reticle-readout" },
      `ELAPSED ${e.toFixed(1)}%`, reticle);
    mk("text", { x: M.l + 3, y: y(u) - 5, class: "reticle-readout" },
      `USED ${Math.round(u)}%`, reticle);
    drawFlightPath(reticle, entry, markId, e, u);
  }

  /* Three red forecasts share the same selected path: since window start, then
     the two recent rates its own class is read in. Recent lines are omitted when
     their requested span has no earlier real sample. Extracted from the mark loop
     so the pooled mark draws the SAME forecast rather than a second copy of it
     that can drift (operator, 2026-08-17). */
  function drawFlightPath(reticle, entry, markId, e, u) {
    for (const horizon of horizonsFor(entry)) {
      const projection = projectionFor(horizon, entry);
      if (!projection) continue;
      const { endE, endU, requestMs, forwardMs } = projection;
      const x0 = x(e), y0 = y(u), x1 = x(endE), y1 = y(endU);
      const d = `M${x0.toFixed(1)},${y0.toFixed(1)} L${x1.toFixed(1)},${y1.toFixed(1)}`;
      /* the fat invisible hit stroke starts a little way down the line, or every
         horizon's pad would pile up on the mark they all begin at */
      const reach = Math.hypot(x1 - x0, y1 - y0);
      const step = reach > 0 ? Math.min(9, reach * 0.5) / reach : 0;
      const dHit = `M${(x0 + (x1 - x0) * step).toFixed(1)},${(y0 + (y1 - y0) * step).toFixed(1)} `
        + `L${x1.toFixed(1)},${y1.toFixed(1)}`;
      const attrs = { "data-mark": markId, "data-provider": entry.account.provider,
        "data-horizon": horizon.id, "data-rank": horizon.rank,
        "data-request-ms": Math.round(requestMs),
        "data-forward-ms": Math.round(forwardMs) };
      const bare = horizon.rank === "near";   // the nearest is a plain line, nothing on its end
      mk("path", { ...attrs, class: `ils-projection ils-projection--${horizon.rank}`, d,
        ...(bare ? {} : { "marker-end": "url(#projection-arrow)" }) }, null, reticle);
      mk("path", { ...attrs, class: "ils-projection-hit", d: dHit }, null, reticle);
      if (!bare) {
        mk("circle", { ...attrs, cx: x(endE), cy: y(endU), r: 2.5,
          class: "ils-projection-dot" }, null, reticle);
      }
      /* a terminus that lands on the mark is not a separate target, and its pad
         would swallow the mark's own hover — so it only gets one when distinct,
         and the bare nearest line never does */
      if (!bare && reach > 9) {
        mk("circle", { ...attrs, cx: x(endE), cy: y(endU), r: 8,
          class: "ils-projection-dot-hit" }, null, reticle);
      }
    }
  }

  /* ── the pool ──
     All three Anthropic weeklies as one budget, on the beam that already judges
     every other mark. It was on the Detail view and missing here, which made the
     panel and the deck disagree about what the position is (operator, 2026-08-15).
     Only instants where EVERY component has been read are plotted: a mean missing
     a term is a smaller number wearing the same axis.

     It is a MARK, not a caption (operator, 2026-08-17): it carries a data-mark, a
     hit pad, a reticle and the same three forecasts every other mark gets, so
     pointing at it does here exactly what it does on the deck. Drawn inert, it
     was the one thing on this frame that did not answer a pointer — and it
     answers to `CLAUDE POOL`, the name the deck gives it. */
  const pool = SNAP.pool;
  if (pool) {
    const px2 = x(pool.pace_percent), py2 = y(pool.used_percent);
    const series = entries
      .filter(entry => entry.account.provider === "Claude" && entry.window.meter_id === "weekly_all")
      .map(entry => ({ w: entry.window,
        pts: (SNAP.trails[`${entry.account.display}/${entry.window.meter_id}`] || [])
          .filter(pt => pt.length >= 3).map(pt => ({ at: Number(pt[0]), u: Number(pt[2]) })) }))
      .filter(entry => entry.pts.length && startOf(entry.w) != null && endOf(entry.w) != null);
    const trail = [];
    const poolSamples = [];
    if (series.length === pool.count) {
      const times = [...new Set(series.flatMap(entry => entry.pts.map(pt => pt.at)))].sort((a, b) => a - b);
      const cursor = series.map(() => -1);
      for (const t of times) {
        let used = 0, elapsed = 0, ready = true;
        series.forEach((entry, i) => {
          while (cursor[i] + 1 < entry.pts.length && entry.pts[cursor[i] + 1].at <= t) cursor[i]++;
          if (cursor[i] < 0) { ready = false; return; }
          const st = startOf(entry.w), en = endOf(entry.w);
          used += entry.pts[cursor[i]].u;              // carried forward: unread is not moved
          elapsed += clamp((t - st) / (en - st) * 100, 0, 100);
        });
        if (ready) {
          const e = elapsed / series.length, u = used / series.length;
          trail.push([e, u]);
          poolSamples.push({ at: t, e, u });
        }
      }
    }
    trail.push([pool.pace_percent, pool.used_percent]);
    poolSamples.push({ at: Date.now(), e: pool.pace_percent, u: pool.used_percent });
    if (trail.length > 1) {
      mk("path", { class: "ils-pool-trail", "data-mark": POOL_MARK, "data-provider": "Claude", "data-class": "pool",
        d: trail.map(([e, u], i) => `${i ? "L" : "M"}${x(e).toFixed(1)},${y(u).toFixed(1)}`).join(" ") });
    }
    const poolGroup = mk("g", { class: "ils-pool-mark", "data-mark": POOL_MARK,
      "data-provider": "Claude", "data-class": "pool", "data-elapsed": pool.pace_percent.toFixed(1),
      "data-used": Math.round(pool.used_percent).toString() });
    /* `pointer-events: all` on a <g> buys nothing — a group has no geometry, so
       hit testing falls to the children, and a burst is eleven hairlines whose
       very centre is the gap they radiate from. The pad is what makes it
       pointable at all (operator, 2026-08-17). First child, so a ray or the tag
       drawn after it still wins the pointer. */
    mk("circle", { cx: px2, cy: py2, r: 10, class: "ils-pool-hit" }, null, poolGroup);
    claudeBurst(mk, px2, py2, 7, poolGroup);
    const leftward = px2 > M.l + W * .7;   // never let the label leave the glass
    mk("text", { x: leftward ? px2 - 10 : px2 + 10, y: py2 + 3.4, class: "ils-pool-tag",
      "text-anchor": leftward ? "end" : "start" },
      `CLAUDE POOL ${pool.used_percent.toFixed(0)}%${pool.floor ? "+" : ""}`, poolGroup);
    const poolWindow = buildPoolWindow(entries);
    if (poolWindow) {
      const poolEntry = { window: poolWindow, at: pool.pace_percent, samples: poolSamples,
                          session: false, lastKnown: false,
                          account: { provider: "Claude", display: "Pool", stale: Boolean(pool.floor) } };
      const reticle = mk("g", { class: "selection-reticle", "data-mark": POOL_MARK,
        "data-provider": "Claude", "data-class": "pool", "data-elapsed": `${pool.pace_percent.toFixed(1)}%`,
        "data-used": `${Math.round(pool.used_percent)}%` });
      mk("line", { x1: px2, y1: py2, x2: px2, y2: M.t + H }, null, reticle);
      mk("line", { x1: M.l, y1: py2, x2: px2, y2: py2 }, null, reticle);
      mk("circle", { cx: px2, cy: py2, r: 10, class: "reticle-ring" }, null, reticle);
      mk("text", { x: px2, y: VH - 7, "text-anchor": "middle", class: "reticle-readout" },
        `ELAPSED ${pool.pace_percent.toFixed(1)}%`, reticle);
      mk("text", { x: M.l + 3, y: py2 - 5, class: "reticle-readout" },
        `USED ${Math.round(pool.used_percent)}%`, reticle);
      drawFlightPath(reticle, poolEntry, POOL_MARK, pool.pace_percent, pool.used_percent);
    }
  }

  /* ── the total pool ──
     Claude, Codex and Grok (never Kimi) as one budget, each weekly weighted by
     what its subscription costs — glideslope.total_pool. Same beam, same reading,
     same mark behaviour as the Claude pool; it wears Σ because it is not Claude. */
  const total = SNAP.pool_total;
  if (total) {
    const tx = x(total.pace_percent), ty = y(total.used_percent);
    const weights = new Map((total.components || []).map(c => [c.display, Number(c.price_usd) || 0]));
    const series = entries
      .filter(entry => weights.has(entry.account.display) && !entry.session && !entry.fable)
      .map(entry => ({ w: entry.window, weight: weights.get(entry.account.display),
        pts: (SNAP.trails[`${entry.account.display}/${entry.window.meter_id}`] || [])
          .filter(pt => pt.length >= 3).map(pt => ({ at: Number(pt[0]), u: Number(pt[2]) })) }))
      .filter(entry => entry.pts.length && startOf(entry.w) != null && endOf(entry.w) != null);
    const trail = [], totalSamples = [];
    if (series.length === total.count) {
      const sum = series.reduce((acc, entry) => acc + entry.weight, 0);
      const times = [...new Set(series.flatMap(entry => entry.pts.map(pt => pt.at)))].sort((a, b) => a - b);
      const cursor = series.map(() => -1);
      for (const t of times) {
        let used = 0, elapsed = 0, ready = true;
        series.forEach((entry, i) => {
          while (cursor[i] + 1 < entry.pts.length && entry.pts[cursor[i] + 1].at <= t) cursor[i]++;
          if (cursor[i] < 0) { ready = false; return; }
          const st = startOf(entry.w), en = endOf(entry.w);
          used += entry.weight * entry.pts[cursor[i]].u;
          elapsed += entry.weight * clamp((t - st) / (en - st) * 100, 0, 100);
        });
        if (ready) {
          trail.push([elapsed / sum, used / sum]);
          totalSamples.push({ at: t, e: elapsed / sum, u: used / sum });
        }
      }
    }
    trail.push([total.pace_percent, total.used_percent]);
    totalSamples.push({ at: Date.now(), e: total.pace_percent, u: total.used_percent });
    if (trail.length > 1) {
      mk("path", { class: "ils-pool-trail", "data-mark": TOTAL_POOL_MARK, "data-provider": "Total",
        "data-class": "pool-total",
        d: trail.map(([e, u], i) => `${i ? "L" : "M"}${x(e).toFixed(1)},${y(u).toFixed(1)}`).join(" ") });
    }
    const totalGroup = mk("g", { class: "ils-pool-mark", "data-mark": TOTAL_POOL_MARK,
      "data-provider": "Total", "data-class": "pool-total",
      "data-elapsed": total.pace_percent.toFixed(1), "data-used": Math.round(total.used_percent).toString() });
    mk("circle", { cx: tx, cy: ty, r: 10, class: "ils-pool-hit" }, null, totalGroup);
    mk("text", { x: tx, y: ty, class: "ils-total-glyph" }, "Σ", totalGroup);
    const leftward = tx > M.l + W * .7;
    mk("text", { x: leftward ? tx - 10 : tx + 10, y: ty + 3.4, class: "ils-pool-tag",
      "text-anchor": leftward ? "end" : "start" },
      `TOTAL POOL ${total.used_percent.toFixed(0)}%${total.floor ? "+" : ""}`, totalGroup);
    const parts = series.map(entry => entry.w);
    if (parts.length === total.count) {
      const sum = series.reduce((acc, entry) => acc + entry.weight, 0);
      const totalWindow = {
        meter_id: "total_pool", label: "Weekly · total pool", used_percent: total.used_percent,
        window_minutes: series.reduce((acc, entry) => acc + entry.weight * entry.w.window_minutes, 0) / sum,
        resets_at: new Date(series.reduce((acc, entry) => acc + entry.weight * Date.parse(entry.w.resets_at), 0) / sum).toISOString(),
        presumed: false, rolled_periods: 0, anchored: true,
      };
      const totalEntry = { window: totalWindow, at: total.pace_percent, samples: totalSamples,
                           session: false, lastKnown: false,
                           account: { provider: "Total", display: "Total", stale: Boolean(total.floor) } };
      const reticle = mk("g", { class: "selection-reticle", "data-mark": TOTAL_POOL_MARK,
        "data-provider": "Total", "data-class": "pool-total",
        "data-elapsed": `${total.pace_percent.toFixed(1)}%`, "data-used": `${Math.round(total.used_percent)}%` });
      mk("line", { x1: tx, y1: ty, x2: tx, y2: M.t + H }, null, reticle);
      mk("line", { x1: M.l, y1: ty, x2: tx, y2: ty }, null, reticle);
      mk("circle", { cx: tx, cy: ty, r: 10, class: "reticle-ring" }, null, reticle);
      mk("text", { x: tx, y: VH - 7, "text-anchor": "middle", class: "reticle-readout" },
        `ELAPSED ${total.pace_percent.toFixed(1)}%`, reticle);
      mk("text", { x: M.l + 3, y: ty - 5, class: "reticle-readout" },
        `USED ${Math.round(total.used_percent)}%`, reticle);
      drawFlightPath(reticle, totalEntry, TOTAL_POOL_MARK, total.pace_percent, total.used_percent);
    }
  }

  bindSelection(document.querySelector(".plot-wrap"));
  /* The frame is redrawn on every resize, so the nodes carrying the emphasis are
     brand new. Re-state it from the one place that knows it, or a lean the
     pointer is still holding silently lets go. */
  applySelection(selectedMark);
}

function fillRegister(register, entries) {
  const dormantAccounts = SNAP.accounts.filter(a => a.dormant);
  if (!entries.length && !dormantAccounts.length) {
    register.style.gridTemplateRows = "none";
    register.innerHTML = `<div class="plot-empty">No window has been read yet.</div>`;
    return;
  }
  const groups = new Map();
  for (const entry of entries) {
    const family = familyFor(entry.account.provider);
    if (!groups.has(family)) groups.set(family, []);
    groups.get(family).push(entry);
  }
  // A dormant account is never plotted, so it has no plot entry — but the
  // register is a family roll-call, and dropping it from that list would
  // read as "forgot it exists" rather than "nothing left to say about it."
  for (const account of dormantAccounts) {
    const family = familyFor(account.provider);
    if (!groups.has(family)) groups.set(family, []);
    groups.get(family).push({ account, dormant: true });
  }
  /* Every register row carries what that meter's own current window would cost at
     list API prices (the optional spend ledger): the 7 DAY row its week, the F row the Fable share of
     it, the 5 HOUR row its session. The pools read the rolling seven days. Totals
     live in the Detail view, not here (operator, 2026-09-24). */
  const SPEND = SNAP.spend || null;
  {
    const head = document.getElementById("preview-spend");
    const P = SPEND && SPEND.providers;
    const total = P && P.Total && P.Total.d7 ? P.Total.d7.usd : null;
    if (head) {
      const fmt = v => v == null || !Number.isFinite(v) ? "—" : v < 10 ? `$${v.toFixed(2)}`
        : v < 1000 ? `$${Math.round(v)}` : v < 10000 ? `$${(v / 1000).toFixed(2)}k` : `$${(v / 1000).toFixed(1)}k`;
      head.innerHTML = `<span class="k">7 days · API-eq</span><span class="v num">${fmt(total)}</span>`;
      head.title = P ? ["Anthropic", "Codex", "Kimi", "Grok"]
          .map(n => `${n} ${fmt(P[n] && P[n].d7 ? P[n].d7.usd : null)}`).join(" · ")
          + " — what the last 7 days of tokens would cost at list API prices; not money spent"
        : "no spend ledger yet";
    }
  }
  const spendFmt = v => v == null || !Number.isFinite(v) ? "—"
    : v === 0 ? "$0" : v < 10 ? `$${v.toFixed(2)}` : v < 1000 ? `$${Math.round(v)}`
    : v < 10000 ? `$${(v / 1000).toFixed(2)}k` : v < 100000 ? `$${(v / 1000).toFixed(1)}k` : `$${Math.round(v / 1000)}k`;
  const spendCell = (key, fallbackTitle) => {
    const m = SPEND && SPEND.meters ? SPEND.meters[key] : null;
    const title = m ? "API-equivalent in this window at list prices; not money spent" : (fallbackTitle || "no spend ledger for this meter");
    return `<span class="reg-spend num" title="${title}">${m ? spendFmt(m.usd) : "—"}</span>`;
  };
  const anthropicColumn = document.createElement("div");
  anthropicColumn.className = "register-column register-column-anthropic";
  const providerColumn = document.createElement("div");
  providerColumn.className = "register-column register-column-providers";
  register.append(anthropicColumn, providerColumn);
  for (const [family, familyEntries] of [...groups.entries()].sort((a, b) => familyRank(a[0]) - familyRank(b[0]))) {
    const box = document.createElement("section");
    box.className = `register-family family-${family.toLowerCase()}`;
    box.dataset.family = family;
    const fam = SPEND && SPEND.providers ? SPEND.providers[family] : null;
    const famTotal = fam && fam.d7
      ? `<span class="family-total num" title="${escapeHTML(family)}: API-equivalent at list prices, rolling 7 days${fam.all ? ` · ${spendFmt(fam.all.usd)} all time` : ""}; not money spent">${spendFmt(fam.d7.usd)}<small>7D</small></span>`
      : "";
    const hint = family === "Anthropic"
      ? `<span class="switch-hint" data-live="">${SWITCH_HINT}</span>` : "";
    box.innerHTML = `<div class="family-label"><span>${escapeHTML(family)}${hint}</span>${famTotal}</div>`;
    const rows = document.createElement("div");
    rows.className = "family-rows";
    for (const entry of familyEntries) {
      if (entry.dormant) {
        const drow = document.createElement("div");
        drow.className = "reg-row dormant";
        drow.dataset.mark = `${entry.account.display}/dormant`;
        drow.dataset.provider = entry.account.provider;
        drow.dataset.account = entry.account.display;
        drow.dataset.dormant = "true";
        drow.dataset.class = "weekly";
        drow.style.setProperty("--acc", colorFor(entry.account.display));
        drow.innerHTML = `
          <span class="reg-key"></span>
          <span class="reg-name"><span class="reg-account">${escapeHTML(entry.account.display)}</span>
            <span class="dormant-tag">dormant</span><span class="reg-clock">—</span></span>
          <span class="reg-spend num">—</span>
          <span class="reg-dev num">—</span>
          <span class="reg-used num">—</span>`;
        rows.appendChild(drow);
        continue;
      }
      const state = stateOf(entry.account, entry.window);
      const deviation = entry.plottable
        ? entry.window.used_percent - entry.at : null;
      const name = registerNameHTML(entry.account, entry.window, entry.session);
      const row = document.createElement("div");
      row.className = `reg-row ${entry.session ? "session" : "weekly"}`
        + (entry.fable ? " fable" : "")
        + (isHere(entry.account) ? " logged-in" : "")
        + (isThere(entry.account) ? " remote-login" : "");
      row.style.setProperty("--acc", colorFor(entry.account.display));
      row.dataset.mark = `${entry.account.display}/${entry.window.meter_id}`;
      row.dataset.provider = entry.account.provider;
      row.dataset.account = entry.account.display;
      row.dataset.window = entry.window.meter_id;
      row.dataset.class = classOf(entry);
      const used = entry.window.resets_at && entry.window.used_percent != null
        ? `${Math.round(entry.window.used_percent)}%` : "—";
      row.innerHTML = `
        <span class="reg-key">${badgeSVG(entry.account, entry.window, entry.session)}</span>
        <span class="reg-name">${name}</span>
        ${spendCell(`${entry.account.display}/${entry.window.meter_id}`)}
        <span class="reg-dev num ${state.tone}">${deviation == null ? "—"
          : (deviation >= 0 ? "+" : "−") + Math.abs(deviation).toFixed(0) + "%"}</span>
        <span class="reg-used num">${used}</span>`;
      if (entry.account.provider === "Claude" && !entry.account.dormant) {
        row.classList.add("switchable");
        row.title = isHere(entry.account)
          ? `${entry.account.display} · this machine's account`
          : `Switch to ${entry.account.display}…`;
        row.addEventListener("click", () => openAccountDialog(entry.account));
        row.addEventListener("pointerenter", () => hoverAccount(entry.account));
        row.addEventListener("pointerleave", () => hoverAccount(null));
      }
      rows.appendChild(row);
    }
    box.appendChild(rows);
    (family === "Anthropic" ? anthropicColumn : providerColumn).appendChild(box);
  }
  /* The two pools, named in words with their numbers — the frame only tags them.
     Claude's burst for the Claude pool, Σ for everything Glideslope pools. */
  const pools = [
    SNAP.pool && { pool: SNAP.pool, mark: POOL_MARK, provider: "Claude", cls: "pool",
                   name: "Claude", glyph: claudeBurstSVG(14) },
    SNAP.pool_total && { pool: SNAP.pool_total, mark: TOTAL_POOL_MARK, provider: "Total", cls: "pool-total",
                         name: "Total", glyph: `<svg class="total-glyph" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><text x="10" y="10.5">Σ</text></svg>` },
  ].filter(Boolean);
  if (pools.length) {
    const box = document.createElement("section");
    box.className = "register-family family-pools";
    box.dataset.family = "Pools";
    box.innerHTML = `<div class="family-label">Pools</div>`;
    const rows = document.createElement("div");
    rows.className = "family-rows";
    for (const { pool, mark, provider, cls, name, glyph } of pools) {
      const row = document.createElement("div");
      row.className = "reg-row weekly pool-row";
      row.dataset.mark = mark;
      row.dataset.provider = provider;
      row.dataset.class = cls;
      row.style.setProperty("--acc", "var(--ink-2)");
      const deviation = pool.used_percent - pool.pace_percent;
      const tone = pool.verdict === "ahead" ? "ahead" : pool.verdict === "trailing" ? "trailing" : "";
      const resetIn = Date.parse(pool.next_reset_at || "") - Date.now();
      row.innerHTML = `
        <span class="reg-key">${glyph}</span>
        <span class="reg-name"><span class="reg-account">${escapeHTML(name)}</span> <span class="reg-window"><span class="window-chip weekly">7D</span>${Number.isFinite(resetIn) ? ":" : ""}</span> <span class="reg-clock${Number.isFinite(resetIn) ? "" : " missing"}">${Number.isFinite(resetIn) ? escapeHTML(fmtDur(resetIn)) : "—"}</span></span>
        <span class="reg-spend num" title="API-equivalent, rolling 7 days">${spendFmt(SPEND && SPEND.providers && SPEND.providers[provider === "Claude" ? "Anthropic" : "Total"] ? SPEND.providers[provider === "Claude" ? "Anthropic" : "Total"].d7.usd : null)}</span>
        <span class="reg-dev num ${tone}">${(deviation >= 0 ? "+" : "−") + Math.abs(deviation).toFixed(0)}%</span>
        <span class="reg-used num">${Math.round(pool.used_percent)}%${pool.floor ? "+" : ""}</span>`;
      rows.appendChild(row);
    }
    box.appendChild(rows);
    providerColumn.appendChild(box);
  }
}

/* Two emphases can rest on the frame at once — the mark under the pointer, and
   the filter (previewed or held). Both are written by this one function, so they
   can never disagree, and neither can strand a node: whatever the state is now,
   this repaints every node from scratch. */
let selectedMark = null;
let selectionClearTimer = null;

function applySelection(mark) {
  if (selectionClearTimer) {
    clearTimeout(selectionClearTimer);
    selectionClearTimer = null;
  }
  selectedMark = mark || null;
  const filter = FILTERS[activeFilter()];
  for (const node of document.querySelectorAll(
      ".ils-trail, .ils-mark, .selection-reticle, .reg-row, " +
      ".ils-pool-trail, .ils-pool-mark, " +
      ".ils-projection, .ils-projection-hit, .ils-projection-dot, .ils-projection-dot-hit")) {
    const match = Boolean(mark) && node.dataset.mark === mark;
    // projections carry no class of their own; they live inside a reticle that does
    const off = Boolean(filter) && node.dataset.class !== undefined && !filter(node);
    node.classList.toggle("selection-selected", match && !off);
    node.classList.toggle("selection-dimmed", Boolean(mark) && !match);
    node.classList.toggle("filter-off", off);
  }
}
function clearSelectionSoon() {
  if (selectionClearTimer) clearTimeout(selectionClearTimer);
  selectionClearTimer = setTimeout(() => {
    selectionClearTimer = null;
    applySelection(null);
  }, 70);
}

function bindSelection(root) {
  for (const node of root.querySelectorAll(
      ".ils-trail[data-mark], .ils-mark[data-mark], .reg-row[data-mark], " +
      ".ils-pool-trail[data-mark], .ils-pool-mark[data-mark], " +
      ".ils-projection[data-mark], .ils-projection-hit[data-mark], " +
      ".ils-projection-dot[data-mark], .ils-projection-dot-hit[data-mark]")) {
    node.addEventListener("pointerenter", () => applySelection(node.dataset.mark));
    node.addEventListener("pointerleave", clearSelectionSoon);
  }
}

/* The filter bar. Resting on a filter previews it; leaving lets it go; a click
   holds it until clicked again. The buttons never change size or place. */
const filterButtons = [...document.querySelectorAll(".lens[data-filter]")];
function paintFilterBar() {
  const active = activeFilter();
  document.documentElement.dataset.filter = active || "all";
  for (const button of filterButtons) {
    button.setAttribute("aria-pressed", String(button.dataset.filter === pinnedFilter));
    button.dataset.previewing = String(button.dataset.filter === active);
  }
}
function setPreview(filter) {
  if (previewFilter === filter) return;
  previewFilter = filter;
  paintFilterBar();
  applySelection(selectedMark);
}
for (const button of filterButtons) {
  button.addEventListener("pointerenter", () => setPreview(button.dataset.filter));
  button.addEventListener("pointerleave", () => setPreview(null));
  button.addEventListener("focus", () => setPreview(button.dataset.filter));
  button.addEventListener("blur", () => setPreview(null));
  button.addEventListener("click", () => {
    pinnedFilter = pinnedFilter === button.dataset.filter ? null : button.dataset.filter;
    const next = new URL(location.href);
    if (pinnedFilter) next.searchParams.set("filter", pinnedFilter);
    else next.searchParams.delete("filter");
    history.replaceState(null, "", next);
    paintFilterBar();
    applySelection(selectedMark);
  });
}

function renderView() {
  renderPlot();
  paintFilterBar();
}
renderView();
/* The host hands this page the panel's own glass, and the panel's height moves
   with the tenant count — so the face is sized by whoever else shares the host panel.
   The plot re-fits from the room it actually has, never from a constant. */
addEventListener("resize", renderView);

const warnings = (SNAP.warnings || []).map(escapeHTML).filter(Boolean);
document.getElementById("warnings").innerHTML = warnings.length
  ? `<div class="warning">${warnings.join(" · ")}</div>` : "";

const claudeObserved = SNAP.accounts
  .filter(account => account.provider === "Claude")
  .map(account => Date.parse(account.observed_at || ""))
  .filter(Number.isFinite);
/* One freshness read for the whole panel, worn in the footer: the age of the
   oldest gauge on the face (Claude's, since it is the only cached one — Codex and
   Kimi are read live every sample). Build time is not it — a page rebuilt from a
   stale gauge is not fresh, and only the data's age can say so. */
const gaugeAge = claudeObserved.length ? Math.max(0, Date.now() - Math.max(...claudeObserved)) : null;
const ageElement = document.getElementById("last-update");
ageElement.textContent = gaugeAge == null ? "Live · last update unknown"
  : gaugeAge < MIN ? "Live · updated just now"
  : `Live · updated ${fmtDur(gaugeAge)} ago`;
if (gaugeAge == null || gaugeAge > 30 * MIN) ageElement.style.color = "var(--ahead)";

/* The menu-bar host is the only surface that can actually run the sampler. The page sends
   one manifest action label; no command string ever crosses this bridge. */
const refreshButton = document.getElementById("refresh-action");
const refreshStatus = document.getElementById("refresh-status");
const refreshStartedAt = SNAP.built_at;
const REFRESH_WAIT_MS = 195_000;
let refreshBusy = false;
let refreshTimer = null;
// The host bridge. A menu-bar host that embeds this page in a WKWebView registers a
// message handler under this name to receive the Refresh action and reports results
// back through window.gregorovichSurface.actionResult. Without a host, the page is
// simply a page: the button does nothing and says so.
const postSurface = message => {
  try {
    const handler = window.webkit?.messageHandlers?.gregorovichSurface;
    if (!handler) return false;
    handler.postMessage(message);
    return true;
  } catch (_) { return false; }
};
const setRefreshState = (state, text) => {
  refreshStatus.dataset.state = state;
  refreshStatus.textContent = text;
};
async function readBuiltAt() {
  const url = new URL(location.href);
  url.searchParams.set("refresh_probe", String(Date.now()));
  const response = await fetch(url.href, { cache: "no-store" });
  const html = await response.text();
  const match = html.match(/\/\*__SNAPSHOT__\*\/([\s\S]*?)\/\*__END_SNAPSHOT__\*\//);
  return match ? JSON.parse(match[1]).built_at : null;
}
function finishRefresh(state, text) {
  refreshBusy = false;
  if (refreshTimer) clearTimeout(refreshTimer);
  refreshTimer = null;
  refreshButton.disabled = false;
  setRefreshState(state, text);
}
async function waitForRefresh() {
  const deadline = Date.now() + REFRESH_WAIT_MS;
  while (refreshBusy && Date.now() < deadline) {
    try {
      if (await readBuiltAt() !== refreshStartedAt) {
        location.replace(freshSnapshotURL());
        return;
      }
    } catch (_) { /* file:// fetch may be unavailable; the bounded wait remains honest */ }
    await new Promise(resolve => { refreshTimer = setTimeout(resolve, 750); });
  }
  if (refreshBusy) finishRefresh("error", "NO NEW SNAPSHOT — sampler unchanged");
}
function requestRefresh() {
  if (refreshBusy) return;
  if (!postSurface({ action: "runAction", label: "Refresh" })) {
    finishRefresh("error", "REFRESH UNAVAILABLE — USE THE HOST");
    return;
  }
  refreshBusy = true;
  refreshButton.disabled = true;
  setRefreshState("working", "REFRESHING…");
  waitForRefresh();
}
window.gregorovichSurface = window.gregorovichSurface || {};
window.gregorovichSurface.actionResult = result => {
  if (result && dialogPending && result.label === dialogPending) {
    accountActionResult(result);
    return;
  }
  if (!result || result.label !== "Refresh" || !refreshBusy) return;
  if (!result.ok) finishRefresh("error", `REFRESH FAILED — ${result.message || "action failed"}`);
};
refreshButton.addEventListener("click", requestRefresh);

/* ── switching accounts ──
   Switching points NEW sessions on this machine at an account; a running session
   never moves. The page holds no command: it sends the host one manifest action
   label, "Use <Account>" or "Log in <Account>", and the host decides what runs.
   Nothing is sent until the dialog's confirm button is pressed. */
const dialog = document.getElementById("account-dialog");
const dialogKicker = document.getElementById("acct-kicker");
const dialogTitle = document.getElementById("acct-title");
const dialogBody = document.getElementById("acct-body");
const dialogMeters = document.getElementById("acct-meters");
const dialogStatus = document.getElementById("acct-status");
const dialogConfirm = document.getElementById("acct-confirm");
const dialogCancel = document.getElementById("acct-cancel");
const dialogRelogin = document.getElementById("acct-relogin");
const HOT_PERCENT = 90;
let dialogAccount = null;
let dialogMode = null;      // "switch" | "here" | "login"
let dialogPending = null;   // the action label awaiting a result
const hereName = LOCAL_SAT || "this machine";
const heldHere = account => isHere(account)
  || (LOCAL_SAT ? (account.held_on || []).includes(LOCAL_SAT) : false);
const currentHere = () => (SNAP.accounts || []).find(a => a.provider === "Claude" && isHere(a));

const DIALOG_METERS = [["weekly_all", "7 day"], ["weekly_fable", "Fable"], ["session", "5 hour"]];
// A window with no reset clock has not started; the register shows it as "—" too.
const meterUsed = meter => meter && meter.resets_at && meter.used_percent != null
  ? Math.round(meter.used_percent) : null;
function meterCells(account) {
  return DIALOG_METERS.map(([id, label]) => {
    const meter = (account.limits || []).find(limit => limit.meter_id === id);
    const used = meterUsed(meter);
    const hot = used != null && used >= HOT_PERCENT;
    return `<div class="acct-meter${hot ? " hot" : ""}"><b>${used == null ? "—" : `${used}%`}</b>`
      + `<small>${escapeHTML(label.toUpperCase())}</small></div>`;
  }).join("");
}
function setDialogStatus(state, text) {
  dialogStatus.dataset.state = state;
  dialogStatus.textContent = text;
}
function openAccountDialog(account) {
  if (dialogPending) return;
  dialogAccount = account;
  const name = escapeHTML(account.display);
  const current = currentHere();
  dialogTitle.style.setProperty("--acc", colorFor(account.display));
  dialogKicker.textContent = `Claude account · ${hereName}`;
  dialogMeters.innerHTML = meterCells(account);
  setDialogStatus("", "");
  dialogRelogin.hidden = false;
  dialogCancel.textContent = "Cancel";
  dialogConfirm.hidden = false;
  dialogConfirm.disabled = false;
  if (isHere(account)) {
    dialogMode = "here";
    dialogTitle.innerHTML = `<span class="acct-swatch"></span>${name} is in use here`;
    dialogBody.textContent = `New sessions on ${hereName} already start as ${account.display}.`;
    dialogRelogin.hidden = true;
    dialogConfirm.textContent = "Log in again";
    dialogCancel.textContent = "Close";
  } else if (heldHere(account)) {
    dialogMode = "switch";
    dialogTitle.innerHTML = `<span class="acct-swatch"></span>Switch to ${name}?`;
    dialogBody.textContent = `New sessions on ${hereName} will start as ${account.display}.`
      + (current ? ` Sessions already running stay on ${current.display}.` : "");
    dialogConfirm.textContent = `Switch to ${account.display}`;
    const hot = DIALOG_METERS.map(([id, label]) => [label,
      meterUsed((account.limits || []).find(limit => limit.meter_id === id))])
      .filter(([, used]) => used != null && used >= HOT_PERCENT);
    if (hot.length) {
      setDialogStatus("error", `Heads up: ${account.display}'s `
        + hot.map(([label, used]) => `${label} window is at ${used}%`).join(", ") + ".");
    }
  } else {
    dialogMode = "login";
    dialogTitle.innerHTML = `<span class="acct-swatch"></span>${name} has no login here`;
    dialogBody.textContent = `Open a terminal at /login for ${account.display}. `
      + `Sign the browser in to claude.ai as ${account.display} first.`;
    dialogRelogin.hidden = true;
    dialogConfirm.textContent = "Open login";
  }
  dialog.dataset.open = "true";
  dialogCancel.focus();
}
function closeAccountDialog() {
  if (dialogPending) return;
  dialog.dataset.open = "false";
  dialogAccount = null;
  dialogMode = null;
}
function sendAccountAction(kind) {
  if (!dialogAccount || dialogPending) return;
  const label = `${kind} ${dialogAccount.display}`;
  if (!postSurface({ action: "runAction", label })) {
    const who = dialogAccount.display.toLowerCase();
    setDialogStatus("error", kind === "Use"
      ? `NO HOST HERE — run: claude-account use ${who}`
      : `NO HOST HERE — run: tools/claude-login-pane ${who}`);
    return;
  }
  dialogPending = label;
  dialogConfirm.disabled = true;
  dialogCancel.disabled = true;
  dialogRelogin.disabled = true;
  setDialogStatus("working", kind === "Use" ? "SWITCHING…" : "OPENING A LOGIN PANE…");
}
function accountActionResult(result) {
  const label = dialogPending;
  dialogPending = null;
  dialogCancel.disabled = false;
  dialogRelogin.disabled = false;
  if (!result.ok) {
    dialogConfirm.disabled = false;
    setDialogStatus("error", `FAILED — ${result.message || "action failed"}`);
    return;
  }
  dialogConfirm.hidden = true;
  dialogRelogin.hidden = true;
  dialogCancel.textContent = "Close";
  if (label.startsWith("Use ")) {
    const name = label.slice(4);
    setDialogStatus("ok", `New sessions now start as ${name}. Updating the board…`);
    setTimeout(closeAccountDialog, 1400);
    // The login watcher rebuilds the views within about 20 s; wait for that build.
    refreshBusy = true;
    refreshButton.disabled = true;
    setRefreshState("working", `SWITCHED TO ${name.toUpperCase()} · UPDATING…`);
    waitForRefresh();
  } else {
    setDialogStatus("ok", "Login pane opened. Type /login there.");
  }
}
dialogConfirm.addEventListener("click", () => {
  sendAccountAction(dialogMode === "switch" ? "Use" : "Log in");
});
dialogRelogin.addEventListener("click", () => sendAccountAction("Log in"));
dialogCancel.addEventListener("click", closeAccountDialog);
dialog.addEventListener("click", event => { if (event.target === dialog) closeAccountDialog(); });
document.addEventListener("keydown", event => {
  if (event.key === "Escape" && dialog.dataset.open === "true") closeAccountDialog();
});
})();
</script>
</body>
</html>
