<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glideslope — Popup</title>
<link rel="icon" type="image/svg+xml" href="__GLIDESLOPE_ICON__">
<style>
  :root {
    color-scheme: dark;
    --void: #05070b;
    --surface: #0a0e14;
    --panel: #0d1219;
    --panel-2: #111826;
    --bezel: #1d2836;
    --bezel-bright: #33445a;
    --goldhi: #ffd76a;
    --golddim: #8a6a24;
    --ink: #e8eef6;
    --ink-2: #b6c2d1;
    --muted: #7d8a9c;
    --muted-2: #4d5a6b;
    /* The three Anthropic accounts are one clay family — siblings in hue, so the
       eye reads "Anthropic" before it reads "which one". Which one you are
       logged into is answered in luminance instead (the ink ring below). */
    --alpha:   #d97757;   /* clay  */
    --bravo:   #d4a27f;   /* kraft */
    --charlie: #b0503c;   /* brick */
    --delta:   #c28b2c;   /* ochre */
    --codex: #1ba576;
    --kimi: #d1568f;
    --grok: #5b9cff;
    --router: #8d68e8;
    --ahead: #ff8a5b;
    --significant: #ff5167;
    --trailing: #43b7cf;
    /* The two window classes share ONE flush chip column now, so the hue has to
       carry the distinction the old indent used to. Both are far from every
       account hue and from --trailing, which already means TRAILING GLIDESLOPE
       in these same rows; the violet's only near neighbour is OpenRouter's
       --router, and OpenRouter has no window class and never enters the
       register, so the two never meet. */
    --window-week:    #a78bfa;   /* violet — the 7 DAY budget  */
    --window-session: #f5b74e;   /* amber  — the 5 HOUR throttle */
    --window-fable:   #2dd4bf;   /* teal   — the Fable weekly, the budget that binds (2026-09-11) */
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "SF Pro Display", Inter, ui-sans-serif, -apple-system, sans-serif;
    /* The native host draws Back over this fixed reserve. */
    --native-back-width: 84px;
    --native-back-height: 44px;
    --native-back-top: 10px;
    --native-back-right: 18px;
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
  }
  body {
    display: flex;
    justify-content: center;
    padding: 10px;
    color: var(--ink);
    font-family: var(--sans);
  }
  .num { font-variant-numeric: tabular-nums; }

  /* The card is its own box — larger than the host panel and near-square,
     sized by the approach plot (operator ruling 2026-08-12). It still declares
     no fixed pixel size of its own: it fills whatever frame the manifest asks
     the host for, less the padding its drop shadow casts into, and every band
     below is fixed or flexes so the plot gets the remainder. */
  .preview {
    width: 100%;
    height: 100%;
    display: flex;
    flex: 1 1 auto;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--bezel-bright);
    border-radius: 13px;
    background:
      radial-gradient(400px 180px at 80% -10%, rgba(217,119,87,.09), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,.03), transparent 20%),
      rgb(10,14,20);
    box-shadow: 0 22px 60px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.05) inset;
  }

  /* Fixed to the host's masthead rhythm while fully containing the native Back
     control the host draws over it (--native-back-*, bottom edge at 54px):
     the card starts 10px down the page, so 52 + 10 clears 54 with room. */
  .preview-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 102px;
    grid-template-rows: auto;
    column-gap: 10px;
    align-items: center;
    height: 52px;
    flex: 0 0 52px;
    /* content centred 22px into the card = 32px down the page, the centre of the
       host's Back reserve (top 10 + height 44 / 2), so title, total and BACK share
       one line (operator, 2026-09-24: "the top row spacing is a little messed up") */
    padding: 0 16px 8px;
    border-bottom: 2px solid var(--golddim);
  }
  .preview-wordmark {
    grid-column: 1;
    overflow: hidden;
    min-width: 0;
    color: var(--goldhi);
    font: 600 11.5px/1 var(--mono);
    letter-spacing: .12em;
    text-overflow: ellipsis;
    text-shadow: 0 0 10px rgba(255,215,106,.24);
    white-space: nowrap;
  }

  /* the total 7-day API-equivalent across every subscription, top right, just left
     of the host's Back reserve (operator, 2026-09-24) */
  .preview-spend {
    grid-column: 2;
    display: flex;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
  }
  /* quiet by request: a reading, not a headline */
  .preview-spend .k {
    color: var(--muted-2, var(--muted));
    font: 640 9px/1 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .preview-spend .v {
    color: var(--ink-2);
    font: 650 12px/1 var(--mono);
    font-variant-numeric: tabular-nums;
  }

  .lens-bar {
    display: flex;
    flex: 0 0 auto;
    gap: 6px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--bezel);
  }
  .lens {
    flex: 1;
    min-width: 0;
    padding: 7px 0;
    border: 1px solid transparent;
    border-radius: 6px;
    background: none;
    color: var(--muted);
    font: 680 10px/1 var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .lens:hover { color: var(--ink-2); }
  .lens[aria-pressed="true"] {
    border-color: var(--bezel-bright);
    background: var(--panel-2);
    color: var(--ink);
  }
  /* The filters are previews, not tabs: resting on one shows only its set,
     leaving shows everything again, and a click holds it (operator, 2026-09-14).
     Previewing lights the button; holding also gives it the pressed frame. */
  .lens[data-previewing="true"] { color: var(--ink); background: color-mix(in oklab, var(--panel-2) 60%, transparent); }
  .lens[aria-pressed="true"] { box-shadow: inset 0 -2px 0 var(--goldhi); }
  /* Filtered out: gone from the frame, faded in the register — a register row
     never leaves, so nothing under the pointer moves. */
  #ils .filter-off { display: none; }

  /* ── the approach plot ──
     The Detail view's plot, and the reason this card is the size it is: same
     frame, same beam, same symbols (solid line + triangle = the 7 DAY budget ·
     dotted line + hollow dashed circle = the 5 HOUR throttle). The deck's 150 px label gutter is still not what a
     near-square card wants, so every mark is named in a two-column register
     beneath the frame instead of beside it. */
  .plot-wrap {
    min-height: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 10px 12px 4px;
  }
  /* `display: flex` outranks the UA's [hidden] rule — without this the plot
     stays on the glass under every other lens, eating the table's room. */
  .plot-wrap[hidden] { display: none; }
  /* the total pool wears Σ — it is not Claude, so it cannot wear Claude's burst */
  .ils-total-glyph { fill: var(--ink); font: 700 15px var(--mono); text-anchor: middle;
                     dominant-baseline: central; pointer-events: none; }
  .total-glyph text { fill: var(--ink-2); font: 700 15px var(--mono); text-anchor: middle; dominant-baseline: central; }
  .plot-frame { min-height: 0; flex: 1; }
  #ils { display: block; width: 100%; height: 100%; overflow: visible; }
  .ils-frame { fill: rgba(5,7,11,.5); stroke: var(--bezel); stroke-width: 1; }
  .ils-grid { stroke: var(--bezel); stroke-width: .7; opacity: .5; }
  .ils-frame, .ils-grid, .ils-beam, .ils-beam-glow, .ils-axis, .ils-zone { pointer-events: none; }
  /* the beam: where even burn would put you — the whole reading is the gap to it */
  /* The beam is the reference instrument, so its neutral gray needs to survive
     the compact glass beneath the colored series. */
  .ils-beam { stroke: var(--ink-2); stroke-width: 1.8; stroke-dasharray: 8 5; opacity: .95; }
  .ils-beam-glow { stroke: var(--ink-2); stroke-width: 6; opacity: .13; }
  .ils-axis { fill: var(--muted-2); font: 600 9px var(--mono); letter-spacing: .08em; }
  .ils-zone { fill: var(--muted-2); font: 600 8.4px var(--mono); letter-spacing: .12em; }
  .ils-trail { fill: none; stroke-width: 1.7; opacity: .55; stroke-linecap: round; pointer-events: stroke; }
  .ils-mark { pointer-events: all; }
  .ils-trail.weekly { stroke-dasharray: none; }
  /* A throttle is a dotted flight path, not a loose dashed one: the dots are
     close enough to read as one disciplined instrument line. */
  .ils-trail.session { stroke-dasharray: 1 2.2; opacity: .4; stroke-linecap: round; }
  /* 7 DAY = the budget: a solid disc. 5 HOUR = the throttle: a hollow dashed
     triangle. Named for what they MEAN, not what they draw. */
  .ils-budget { stroke: var(--void); stroke-width: 2; }
  .ils-throttle { fill: none; stroke-width: 2; stroke-dasharray: 2 2.2;
                  stroke-linecap: round; stroke-linejoin: round; }
  /* the plot's meter badge: a hollow outline over the void so trails never cut
     through the letter, the letter centred in the account's hue */
  .ils-badge { fill: var(--void); stroke-width: 1.8; stroke-linejoin: round; }
  .ils-badge-letter { font: 800 10px var(--mono); text-anchor: middle; dominant-baseline: central;
                      pointer-events: none; }
  .ils-mark.last-known { opacity: .72; }
  .ils-mark.presumed { opacity: .5; }
  .ils-mark.presumed .ils-budget, .ils-mark.presumed .ils-throttle { stroke-dasharray: 1.5 2; }
  /* ── Fable ── the per-model weekly rides inside its account's 7 DAY clock in
     its account's hue, so hue cannot separate it: it wears a DIAMOND, a teal
     ring, and a dashed trail. Three rows per Anthropic account, always
     (operator ruling 2026-09-11): 7 DAY, 5 HOUR, Fable. */
  .ils-trail.fable { stroke-dasharray: 4 3; }
  .ils-fable-ring { fill: none; stroke: var(--window-fable); stroke-width: 1.6; }
  /* which account is logged in, said in luminance rather than hue — the three
     Anthropic tones are siblings now, so colour cannot answer it any more */
  /* ── the pool on the beam ──
     Both of its coordinates are means of coordinates already on this frame, so
     it lands on the same y = x beam and needs no axis of its own. Ink, never a
     hue: it is not a provider. */
  .ils-pool { fill: none; stroke: var(--ink); stroke-width: 1.4;
              stroke-linecap: round; opacity: .95; }
  .ils-pool-trail { fill: none; stroke: var(--ink); stroke-width: 1;
                    stroke-dasharray: 4 3; opacity: .34; pointer-events: stroke; }
  .ils-pool-tag { font: 700 9.5px var(--mono); fill: var(--ink); }
  /* the burst is eleven hairlines radiating from the one point they do NOT
     cover, so without a pad it is a mark you can only hit by luck */
  .ils-pool-hit { fill: transparent; stroke: transparent; pointer-events: all; }
  .ils-pool-mark { pointer-events: all; }
  .ils-loggedin-ring { fill: none; stroke: var(--ink); stroke-width: 1.1; opacity: .85; }
  .ils-remote-ring { fill: none; stroke: var(--muted); stroke-width: 1;
    stroke-dasharray: 2 3; opacity: .7; }

  /* Hover is emphasis only. Selection never changes a box's geometry. */
  .ils-trail, .ils-mark, .reg-row, .ils-pool-trail, .ils-pool-mark { transition: opacity .12s ease; }
  .ils-trail.selection-dimmed, .ils-mark.selection-dimmed, .reg-row.selection-dimmed,
  .ils-pool-trail.selection-dimmed, .ils-pool-mark.selection-dimmed { opacity: .3; }
  .ils-trail.selection-selected, .ils-mark.selection-selected, .reg-row.selection-selected,
  .ils-pool-trail.selection-selected, .ils-pool-mark.selection-selected { opacity: 1; }
  /* A filtered-out register row stays faded even under a hover dim — written
     last, and doubled for weight, so it wins whenever both apply. */
  .reg-row.filter-off.filter-off { opacity: .22; }
  /* The hovered account's other windows dim less than everything else: the plot
     still focuses the one window, and the account still reads as one unit. */
  .reg-row.switchable.account-hover.selection-dimmed:not(.filter-off) { opacity: .72; }
  .selection-reticle { opacity: 0; pointer-events: none; transition: opacity .12s ease; }
  .selection-reticle.selection-selected { opacity: 1; }
  .selection-reticle line { stroke: var(--ink-2); stroke-width: .7; opacity: .75; }
  .selection-reticle .reticle-ring { fill: none; stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 2; }
  /* ── the flight path ──
     Where the window ends up at the rate it has burned so far. Red because it
     terminates at the ceiling, and red is the hue this panel already spends on
     capacity — the projection borrows its destination's meaning rather than
     inventing one. Dotted throughout, because none of it is a reading. */
  /* The drawn line takes no pointer events: that is what its `-hit` companion is
     for, and giving both a target meant the visible stroke — which begins ON the
     mark — swallowed hovers meant for the mark itself. */
  .selection-reticle .ils-projection {
    fill: none; stroke: var(--significant); stroke-width: 1.35;
    stroke-linecap: round; opacity: .92; pointer-events: none;
  }
  /* Density reads as recency: the further back a lens looks, the more air its
     dots carry. The nearest is the exception at the end of the ramp — solid and
     bare, no dashes and no terminus symbol, because it is the one read at a
     glance and ornament on a line that short is noise. (Operator, 2026-08-15.)
     Keyed on RANK, not on the horizon's name: a throttle's lenses are 1h/3h/total
     and a budget's are 6h/24h/total (operator, 2026-08-17), and the ramp is about
     how far back a lens reaches relative to its own window. */
  .selection-reticle .ils-projection--far { stroke-dasharray: 1 9; opacity: .82; }
  .selection-reticle .ils-projection--mid { stroke-dasharray: 2 4.5; opacity: .88; }
  .selection-reticle .ils-projection--near { stroke-dasharray: none; opacity: 1; stroke-width: 1.6; }
  .selection-reticle .ils-projection-hit {
    fill: none; stroke: transparent; stroke-width: 10; pointer-events: stroke;
  }
  /* A reticle is invisible until its mark is selected, but `pointer-events` does
     not care about opacity — so every mark's forecasts were capturing the pointer
     across the whole glass. They become pointable when they become visible. */
  .selection-reticle:not(.selection-selected) .ils-projection,
  .selection-reticle:not(.selection-selected) .ils-projection-hit,
  .selection-reticle:not(.selection-selected) .ils-projection-dot,
  .selection-reticle:not(.selection-selected) .ils-projection-dot-hit {
    pointer-events: none;
  }
  /* inert, like the drawn line: interaction belongs to the dedicated hit
     targets, which exist only where they cannot cover the mark */
  .selection-reticle .ils-projection-dot {
    fill: var(--significant); stroke: var(--surface); stroke-width: 1.1;
    pointer-events: none;
  }
  .selection-reticle .ils-projection-dot-hit {
    fill: transparent; stroke: transparent; pointer-events: all;
  }
  .selection-reticle .reticle-readout {
    fill: var(--ink); font: 700 8px var(--mono); letter-spacing: .04em;
    paint-order: stroke; stroke: var(--void); stroke-width: 3px; stroke-linejoin: round;
  }

  /* Two columns, filled DOWN then across (the row count is set from JS): nine
     windows cost five rows of the card's height instead of nine, and the plot
     keeps the difference. */
  .plot-register {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 12px;
    align-items: start;
    padding: 8px 4px 2px;
  }
  .register-column {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .register-family {
    min-width: 0;
    padding: 6px 8px 5px;
    border: 1px solid var(--bezel);
    border-radius: 6px;
    background: rgba(5,7,11,.22);
  }
  .register-family.family-anthropic {
    border-color: color-mix(in oklab, var(--alpha) 58%, var(--bezel));
    box-shadow: 0 0 12px color-mix(in oklab, var(--alpha) 10%, transparent);
  }
  .register-family.family-codex {
    border-color: color-mix(in oklab, var(--codex) 58%, var(--bezel));
    box-shadow: 0 0 12px color-mix(in oklab, var(--codex) 10%, transparent);
  }
  /* the spend column: every register row ends in its window's API-equivalent */
  .reg-spend {
    width: 50px;
    flex: 0 0 auto;
    color: #f3c98b;
    font: 680 12px/1 var(--mono);
    text-align: right;
  }
  .reg-row .reg-spend { opacity: .9; }
  .family-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 3px;
    color: var(--muted);
    font: 700 9.5px/1.1 var(--mono);
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  /* each provider's rolling 7-day API-equivalent, top right of its box */
  .family-total {
    padding-right: 4px;
    color: #d9b682;
    font: 680 10px/1.1 var(--mono);
    letter-spacing: .02em;
    text-transform: none;
    font-variant-numeric: tabular-nums;
  }
  .family-total small { color: var(--muted); font-size: 8.5px; letter-spacing: .1em; margin-left: 4px; }
  .family-rows { display: grid; grid-auto-rows: 24px; }
  .reg-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 24px;
    padding: 0 4px;
    border-radius: 4px;
  }
  /* Which account you are logged into is said the way the plot says it — in
     luminance, never in hue. Gold made the row read as a warning about itself;
     the same emphasis restated in ink is only the sentence "you are here": an
     ink wash, an ink bar down the inside edge, and the row's text lifted from
     --ink-2 to full --ink. No glow: a text-shadow in ink is a smudge, and the
     brightness against the rows around it is already doing the work. The chips
     keep their own ink/steel colours — identity and window class are separate
     axes and neither may repaint the other. */
  .reg-row.logged-in {
    background: color-mix(in oklab, var(--ink) 11%, transparent);
    box-shadow: inset 2px 0 0 var(--ink);
  }
  .reg-row.logged-in .reg-name,
  .reg-row.logged-in .reg-used {
    color: var(--ink);
  }
  /* An account flown from ANOTHER satellite is being spent too — but not from
     this seat, and the row must not claim otherwise. So the same sentence one
     rank quieter: no wash, and the bar moves to the outside edge. */
  .reg-row.remote-login { box-shadow: inset -2px 0 0 var(--muted-2); }
  .reg-row.logged-in.remote-login {
    box-shadow: inset 2px 0 0 var(--ink), inset -2px 0 0 var(--muted-2);
  }
  /* ── switching accounts ──
     A Claude row is a door: clicking it opens this dialog, and nothing moves until
     its confirm button is pressed. The card holds one size in every state, so the
     buttons never jump while a result comes back. */
  .reg-row.switchable { cursor: pointer; }
  /* Hovering any window of an account outlines all of that account's rows: the
     thing a click switches is the account, not the window. An outline, not a
     border, so nothing moves by a pixel. */
  .reg-row.switchable.account-hover {
    outline: 1px solid var(--bezel-bright); outline-offset: -1px;
    background: color-mix(in oklab, var(--ink) 6%, transparent);
  }
  .reg-row.switchable.logged-in.account-hover { background: color-mix(in oklab, var(--ink) 14%, transparent); }
  /* The header says what a click does, and says it more exactly on hover. Fixed
     width, one line, so its changing text never shifts the total beside it. */
  .switch-hint {
    display: inline-block; width: 190px; margin-left: 10px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    color: var(--muted-2); font: 650 8.5px/1.1 var(--mono); letter-spacing: .12em;
    text-transform: uppercase; vertical-align: 1px;
  }
  .switch-hint[data-live="switch"] { color: var(--ink); }
  .switch-hint[data-live="here"] { color: var(--ink-2); }
  .acct-dialog {
    position: fixed; inset: 0; z-index: 50;
    display: none; align-items: center; justify-content: center;
    background: color-mix(in oklab, var(--void) 74%, transparent);
  }
  .acct-dialog[data-open="true"] { display: flex; }
  .acct-card {
    width: 400px; min-height: 212px; box-sizing: border-box;
    display: flex; flex-direction: column; gap: 12px;
    padding: 18px 18px 14px;
    border: 1px solid var(--bezel-bright); border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 18px 48px rgba(0, 0, 0, .55);
    color: var(--ink-2); font: 500 13px/1.45 var(--sans);
  }
  .acct-kicker { color: var(--muted); font: 650 9.5px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .acct-title { color: var(--ink); font: 700 18px/1.2 var(--sans); }
  .acct-title .acct-swatch { display: inline-block; width: 9px; height: 9px; margin-right: 8px;
    border-radius: 50%; background: var(--acc); vertical-align: 2px; }
  .acct-body { min-height: 40px; }
  .acct-meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .acct-meter { padding: 7px 8px; border: 1px solid var(--bezel); border-radius: 6px; background: var(--panel-2); }
  .acct-meter b { display: block; margin-bottom: 4px; color: var(--ink); font: 700 15px/1 var(--mono); }
  .acct-meter small { color: var(--muted); font: 650 8.5px/1 var(--mono); letter-spacing: .12em; }
  .acct-meter.hot b { color: var(--significant); }
  .acct-status { min-height: 18px; color: var(--muted); font: 600 10.5px/1.4 var(--mono); letter-spacing: .04em; }
  .acct-status[data-state="error"] { color: var(--significant); }
  .acct-status[data-state="ok"] { color: var(--codex); }
  .acct-actions { display: flex; align-items: center; gap: 8px; margin-top: auto; }
  .acct-actions .spacer { flex: 1; }
  .acct-btn {
    width: 112px; height: 30px; padding: 0;
    border: 1px solid var(--bezel-bright); border-radius: 6px;
    background: var(--panel-2); color: var(--ink-2);
    font: 680 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; cursor: pointer;
  }
  .acct-btn:hover { color: var(--ink); }
  .acct-btn.primary { width: 150px; border-color: var(--ink); background: var(--ink); color: var(--void); }
  .acct-btn.primary:hover { background: #fff; }
  .acct-btn.quiet { border-color: transparent; background: none; color: var(--muted); }
  .acct-btn[hidden] { visibility: hidden; display: inline-block; }
  .acct-btn:disabled { opacity: .45; cursor: default; }
  /* ── a dormant account ──
     No active subscription: never plotted, never pooled, one dimmed row
     wherever this panel would otherwise give it several. */
  .reg-row.dormant, tr.dormant, tr[data-dormant="true"] { opacity: .45; }
  .dormant-tag {
    display: inline-block; margin-left: 6px; padding: 1px 5px; border-radius: 3px;
    background: rgba(139,148,158,.18); color: var(--muted); font: 700 8.5px/1.3 var(--mono);
    letter-spacing: .06em; text-transform: uppercase;
  }
  /* the register's key is the same meter badge the plot draws: outline = window
     class, letter = account (see badgeSVG) */
  .reg-key {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
    display: block;
  }
  .reg-key .meter-badge { display: block; overflow: visible; }
  .meter-badge circle, .meter-badge polygon { fill: var(--void); stroke: var(--acc); stroke-width: 1.5; stroke-linejoin: round; }
  .meter-badge.triangle polygon { stroke-dasharray: 2 1.6; }
  .meter-badge text { fill: var(--acc); font: 800 9px var(--mono); text-anchor: middle; dominant-baseline: central; }
  .reg-name {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    color: var(--ink-2);
    font: 680 13px/1 var(--mono);
    letter-spacing: .015em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* The row is read DOWN the column, not one row at a time — and the display
     names run four to seven characters, so one text run put every chip and every
     countdown at its own x and there was nothing to read down. Two fixed columns
     ahead of the countdown fix that: the name column sized for the longest name
     the register can hold ("Charlie", seven), the class column for the chip plus
     the colon that follows it. Both are inline-block and both keep overflow visible
     on purpose — a fixed advance width means an over-long name spills into its
     own gutter instead of shoving the columns behind it out of line, and an
     inline-block with clipped overflow would drop off its text baseline. Never
     grid, never block children: innerText has to stay one line, because the
     honesty gate reads this row as text. */
  .reg-account, .reg-window { display: inline-block; }
  .reg-account { width: 7.5ch; }
  .reg-window { width: 6ch; }
  /* The register is the one list in the popup where a 7 DAY budget and a 5 HOUR
     throttle sit line after line, and two characters of text is not enough to
     tell them apart at a glance. Every chip starts at the same x — one flush
     column, no class indented from the other (operator ruling 2026-08-14) — so
     the chip itself carries the whole distinction, and it carries it on two axes
     at once: the budget filled in violet, the throttle outlined in amber. Same
     box for both, so the column stays a column. */
  .window-chip {
    display: inline-block;
    padding: 1px 3px;
    /* one box for every class: the one-letter F chip is as wide as 7D and 5H,
       so the column reads even (operator, 2026-09-12). The chip is border-box,
       so this is two glyphs plus the padding and border — 3.5ch of this mono. */
    min-width: 3.5ch;
    text-align: center;
    border: 1px solid transparent;
    border-radius: 3px;
    font: 700 9.5px/1 var(--mono);
    letter-spacing: .04em;
    /* An inline-block sits on its TEXT baseline, not its bottom edge, so it
       hangs below the line and grows the row it lives in. 1px is the offset that
       leaves every register row byte-identical to what it was without the chip. */
    vertical-align: 1px;
  }
  .window-chip.weekly {
    border-color: color-mix(in oklab, var(--window-week) 45%, transparent);
    background: color-mix(in oklab, var(--window-week) 18%, transparent);
    color: var(--window-week);
  }
  .window-chip.session {
    border-color: color-mix(in oklab, var(--window-session) 55%, transparent);
    background: transparent;
    color: var(--window-session);
  }
  .window-chip.fable {
    border-color: color-mix(in oklab, var(--window-fable) 60%, transparent);
    background: color-mix(in oklab, var(--window-fable) 20%, transparent);
    color: var(--window-fable);
  }
  tr[data-window="weekly_fable"] .meter-tag {
    color: var(--window-fable);
    border-color: color-mix(in oklab, var(--window-fable) 60%, transparent);
  }
  .fable-chip {
    display: inline-block;
    margin-left: 6px;
    color: var(--window-fable);
    font: 700 10px/1 var(--mono);
    letter-spacing: .03em;
  }
  .fable-chip small { color: var(--muted); font-size: 9px; }
  /* A window with no reset clock used to leave the countdown column blank, which
     reads as "nothing to say here" when the truth is "no value to say". It gets
     a dash instead — and the dash is drawn in --muted, a step below the row's own
     ink, so it can never be mistaken for a read value. */
  .reg-clock.missing { color: var(--muted); }
  /* used % is the rightmost column (operator, 2026-09-24): $ · deviation · used,
     so it needs a fixed advance to stay a column */
  .reg-used { width: 46px; flex: 0 0 auto; text-align: right; color: var(--ink); font: 720 13.2px/1 var(--mono); }
  .reg-dev {
    /* wide enough for the longest deviation the frame can produce — "−100%",
       five monospace glyphs at 12.2px ≈ 37px. The cell never shrinks (flex 0 0),
       so the % sign has to be paid for here or it paints over the used value. */
    width: 46px;
    flex: 0 0 auto;
    color: var(--muted);
    font: 720 12.2px/1 var(--mono);
    text-align: right;
  }
  .reg-dev.ahead { color: var(--ahead); }
  .reg-dev.significant { color: var(--significant); }
  .reg-dev.trailing { color: var(--trailing); }
  .plot-empty {
    padding: 14px 4px;
    color: var(--muted);
    font: 9.4px/1.4 var(--mono);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  col.account { width: 34%; }
  col.used { width: 34%; }
  col.reset { width: 32%; }
  th, td {
    padding: 4px 6px;
    text-align: left;
    vertical-align: middle;
  }
  thead th {
    height: 27px;
    color: var(--muted);
    background: rgba(5,7,11,.22);
    font: 650 8.5px/1 var(--mono);
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  tbody tr {
    /* Set by fitRows() from the space actually left between the header and the
       footer. The menu-bar host's panel is a fixed 364 × 560, so every provider added to the
       position steals height from the same budget; the default is the roomiest
       row, never the assumption that it fits. */
    height: var(--row-height, 37px);
    border-top: 1px solid rgba(29,40,54,.58);
  }
  td.account-cell {
    border-right: 1px solid rgba(29,40,54,.48);
  }
  .account-line {
    display: flex;
    align-items: flex-start;
    gap: 5px;
    min-width: 0;
  }
  .account-key {
    width: 7px;
    height: 7px;
    margin-top: 3px;
    flex: 0 0 auto;
    border-radius: 2px;
    background: var(--account-color);
    box-shadow: 0 0 7px color-mix(in oklab, var(--account-color) 55%, transparent);
  }
  /* Dim by default so one name can be the bright one: the account you are
     actually logged into. Same answer the plot's ink ring gives, same language. */
  .account-name {
    min-width: 0;
    color: var(--ink-2);
    font-size: 11.5px;
    font-weight: 680;
    line-height: 1.18;
  }
  tr.logged-in .account-name { color: var(--ink); font-weight: 720; }
  /* ── two satellites, two gutters ──
     A login is a place now, so the row says which machine holds it: a bright bar
     down the inside edge for the login governing THIS panel, a faint one down the
     outside edge for a login held elsewhere in the fleet. Inset shadows, so no
     row changes size when one appears and nothing below it moves. */
  tr.logged-in > td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
  tr.remote-login > td:last-child { box-shadow: inset -2px 0 0 var(--muted-2); }
  .active, .freshness {
    display: block;
    margin: 3px 0 0 12px;
    color: var(--muted);
    font: 9.2px/1.2 var(--mono);
  }
  .active {
    color: var(--trailing);
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  /* the same fact about another satellite, one rank quieter */
  .active.remote { color: var(--muted); font-weight: 620; }
  .freshness.stale { color: var(--ahead); }
  .meter-tag {
    display: block;
    margin: 3px 0 0 12px;
    color: var(--ink-2);
    font: 700 9.2px/1.2 var(--mono);
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .used-read {
    display: block;
    color: var(--ink);
    font: 720 13px/1 var(--mono);
    white-space: nowrap;
  }
  .used-read .pace {
    margin-left: 3px;
    color: var(--muted);
    font-size: inherit;
    font-weight: inherit;
  }
  /* The ◆ mark with no number behind it: the cell keeps its box and says the
     comparison is missing, rather than vanishing and letting the used value slide
     left. Its own class, never .pace — that one is contract-checked for the
     (◆nn%) form and a dash would break it. */
  .used-read .pace-missing {
    margin-left: 3px;
    color: var(--muted);
    font-size: inherit;
    font-weight: inherit;
  }
  /* the marker on a value nobody read — kept off .pace, which is the ◆ mark's
     own class and is contract-checked for the parenthesized (◆nn%) form */
  .used-read .qual {
    margin-left: 3px;
    color: var(--muted);
    font-size: 9px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .used-read.unknown {
    color: var(--muted);
    font-size: 9px;
    text-transform: uppercase;
  }
  /* One line, always: the state word changes as the window burns, and a label
     that wrapped on its longest phrase would push every row below it. */
  .state {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font: 650 7.4px/1.08 var(--mono);
    letter-spacing: .025em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .state.ahead { color: var(--ahead); }
  .state.significant { color: var(--significant); }
  .state.trailing { color: var(--trailing); }
  /* ── the pooled row ──
     A sum of the rows above it, not a fourth account: no key swatch, no hue, and
     a rule above rather than a colour to set it apart. It must never be mistaken
     for a gauge, because it is arithmetic over three of them. */
  tr.pooled-row > td { border-top: 1px solid var(--bezel-bright); }
  tr.pooled-row .account-name { color: var(--ink-2); font-weight: 640; }
  .pool-glyph { stroke: var(--ink-2); stroke-width: 1.2; stroke-linecap: round;
                fill: none; flex: 0 0 auto; margin-right: 4px; overflow: visible; }
  tr.pooled-row .meter-tag { color: var(--muted); font-weight: 600; }
  /* a pooled budget has no reset of its own — only a next account to come back */
  tr.pooled-row .reset small {
    display: block; margin-top: 3px; color: var(--muted); font: 8.6px/1.15 var(--mono);
  }
  .reset {
    /* Block, not inline: an inline run here inherits the cell's 15px strut and
       silently pads every row ~7px taller than its own content — height the
       fixed panel cannot spare once a fourth provider arrives. */
    display: block;
    color: var(--ink-2);
    font: 9.4px/1.2 var(--mono);
    white-space: nowrap;
  }
  /* countdown, then the day, then the clock — each step down in weight, so the
     cell answers "how long" and "which day" before it answers "what time" */
  .reset em {
    display: block;
    color: var(--ink);
    font: 700 12px/1.1 var(--mono);
    font-style: normal;
  }
  .reset time { display: block; margin-top: 3px; }
  .reset time b {
    display: block;
    color: var(--ink-2);
    font: 650 10.6px/1.15 var(--mono);
  }
  .reset time i {
    display: block;
    margin-top: 1px;
    color: var(--muted);
    font: 8.4px/1.15 var(--mono);
    font-style: normal;
  }
  .warning {
    padding: 6px 8px;
    border-top: 1px solid var(--bezel);
    color: var(--ahead);
    font: 8px/1.25 var(--mono);
  }

  .preview-foot {
    min-height: 38px;
    display: flex;
    flex: 0 0 38px;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    border-top: 1px solid var(--bezel);
    background: rgba(5,7,11,.5);
  }
  .snapshot-age {
    min-width: 0;
    flex: 1;
    overflow: hidden;
    color: var(--muted);
    font: 9.4px/1.3 var(--mono);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .detail-link {
    padding: 7px 9px;
    border: 1px solid var(--bezel-bright);
    border-radius: 6px;
    color: var(--ink-2);
    font: 680 9.2px/1 var(--mono);
    letter-spacing: .07em;
    text-decoration: none;
    white-space: nowrap;
  }
  .detail-link:hover { color: var(--ink); background: var(--panel-2); }
  .refresh-action { width: 86px; text-align: center; }
  .refresh-status {
    width: 152px; flex: 0 0 152px; overflow: hidden; color: var(--muted);
    font: 8px/1.15 var(--mono); letter-spacing: .03em; text-align: right;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .refresh-status[data-state="working"] { color: var(--goldhi); }
  .refresh-status[data-state="error"] { color: var(--ahead); }
</style>
</head>
<body>
<section class="preview" aria-label="Glideslope current-position preview">
  <header class="preview-head">
    <div class="preview-wordmark">GLIDESLOPE</div>
    <div class="preview-spend" id="preview-spend"></div>
  </header>

  <nav class="lens-bar" aria-label="Plot filter">
    <button class="lens" type="button" data-filter="weekly" aria-pressed="false"
            title="Hover to show only the 7 DAY budgets and the pools · click to hold">7 Day</button>
    <button class="lens" type="button" data-filter="session" aria-pressed="false"
            title="Hover to show only the 5 HOUR throttles · click to hold">5 Hour</button>
    <button class="lens" type="button" data-filter="specialty" aria-pressed="false"
            title="Hover to show only the model-specific weeklies (Fable) · click to hold">Specialty</button>
    <button class="lens" type="button" data-filter="anthropic" aria-pressed="false"
            title="Hover to show only Claude · click to hold">Anthropic only</button>
  </nav>

  <section class="plot-wrap" aria-label="Approach plot">
    <div class="plot-frame"><svg id="ils" aria-label="Usage approach plot"></svg></div>
    <div class="plot-register" id="plot-register"></div>
  </section>
  <div id="warnings"></div>

  <div class="acct-dialog" id="account-dialog" data-open="false" role="dialog" aria-modal="true" aria-labelledby="acct-title">
    <div class="acct-card">
      <div class="acct-kicker" id="acct-kicker">Claude account</div>
      <div class="acct-title" id="acct-title"></div>
      <div class="acct-body" id="acct-body"></div>
      <div class="acct-meters" id="acct-meters"></div>
      <div class="acct-status" id="acct-status" role="status" aria-live="polite"></div>
      <div class="acct-actions">
        <button class="acct-btn quiet" id="acct-relogin" type="button">Log in again</button>
        <span class="spacer"></span>
        <button class="acct-btn" id="acct-cancel" type="button">Cancel</button>
        <button class="acct-btn primary" id="acct-confirm" type="button"></button>
      </div>
    </div>
  </div>
  <footer class="preview-foot">
    <span class="snapshot-age num" id="last-update">Live</span>
    <span class="refresh-status" id="refresh-status" role="status" aria-live="polite"></span>
    <button class="detail-link refresh-action" id="refresh-action" type="button">REFRESH</button>
    <a class="detail-link" href="deck.html">DETAIL VIEW →</a>
  </footer>
</section>

<script>
(() => {
"use strict";
const HOUR = 3_600_000, DAY = 24 * HOUR, MIN = 60_000;
const RELOAD_MS = 60_000;
const PAGE_OPENED_AT = Date.now();

/* Keep the compact plot's forecast lenses in lockstep with Detail: the existing
   since-start line plus three recent-rate lines, each backed by real samples. */
/* Three forecasts per mark, and the lookbacks are per CLASS — one set cannot
   serve both (operator, 2026-08-17). A 5 HOUR window is 300 minutes: a 24h
   lookback reaches five whole windows past its own start, so its "rate" was
   never a rate inside the window being forecast. An hour of a 7 DAY budget is
   0.6% of the window — too short to say anything. So a throttle is read in hours
   and a budget in days, and `rank` carries the density ramp so both wear one
   far/mid/near vocabulary. Kept identical to the Detail view's set: the panel and
   the deck must never disagree about what the forecast is. */
const PROJECTION_HORIZONS = {
  session: [
    { id: "start", rank: "far", lookback: null },
    { id: "3h", rank: "mid", lookback: 3 * HOUR },
    { id: "1h", rank: "near", lookback: HOUR },
  ],
  weekly: [
    { id: "start", rank: "far", lookback: null },
    { id: "24h", rank: "mid", lookback: 24 * HOUR },
    { id: "6h", rank: "near", lookback: 6 * HOUR },
  ],
};
const horizonsFor = mark => PROJECTION_HORIZONS[mark.session ? "session" : "weekly"];

/* The face is always the approach plot; the numbers live in the Detail view
   (operator, 2026-09-14). The bar above it filters what the frame shows. Every
   plotted node carries data-class — weekly, session, specialty, pool (Claude's)
   or pool-total — and data-provider, and one predicate decides what survives:
     7 DAY      the weekly budgets and both pools
     5 HOUR     the throttles
     SPECIALTY  the model-specific weeklies (Fable, today)
     ANTHROPIC  anything Claude, the Claude pool included, the total pool not */
const FILTERS = {
  weekly: node => ["weekly", "pool", "pool-total"].includes(node.dataset.class),
  session: node => node.dataset.class === "session",
  specialty: node => node.dataset.class === "specialty",
  anthropic: node => node.dataset.provider === "Claude",
};
/* A held filter survives this page's own minute-ly reload — which carries it in
   the URL — but never outlives the panel: reopening the panel asks the question fresh. */
function initialFilter() {
  const fromURL = new URL(location.href).searchParams.get("filter");
  return FILTERS[fromURL] ? fromURL : null;
}
let pinnedFilter = initialFilter();
let previewFilter = null;
const activeFilter = () => previewFilter || pinnedFilter;
const classOf = entry => entry.fable ? "specialty" : entry.session ? "session" : "weekly";
const TOTAL_POOL_MARK = "Total/pool";

/* Injected by deck-src/build.py — aliases/emails are stripped at build time. */
const SNAP = /*__SNAPSHOT__*/null/*__END_SNAPSHOT__*/;

document.documentElement.dataset.reloadMs = String(RELOAD_MS);
document.documentElement.dataset.reloadOnReturn = "true";

function freshSnapshotURL(now = Date.now()) {
  const next = new URL(location.href);
  next.searchParams.set("snapshot", String(now));
  if (pinnedFilter) next.searchParams.set("filter", pinnedFilter);
  else next.searchParams.delete("filter");
  return next.href;
}
function reloadSnapshot() {
  location.replace(freshSnapshotURL());
}
setTimeout(reloadSnapshot, RELOAD_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - PAGE_OPENED_AT > 5_000) reloadSnapshot();
});

if (!SNAP) {
  document.getElementById("plot-register").innerHTML =
    `<div class="plot-empty">No live snapshot yet.</div>`;
  return;
}

/* Every account names its own token. A display missing here falls through to the
   router purple — which is how Charlie once wore OpenRouter's colour. */
const COLOR_KEYS = { Alpha: "alpha", Bravo: "bravo", Charlie: "charlie", Delta: "delta",
                     Codex: "codex", Kimi: "kimi", Grok: "grok", OpenRouter: "router" };
const colorFor = display => `var(--${COLOR_KEYS[display] || "router"})`;
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
})[char]);
/* ── the fleet's logins ──
   An account is logged in ON a named satellite, and more than one can hold
   one at once (a laptop here, a desktop at the office). HERE governs what the next
   prompt on this machine costs; THERE is a login someone else in the fleet is
   flying. Any provider that declares its holders wears them — Codex is one
   account on several machines, its shared meter every machine's burn. `active`
   is retained as the local half of the same fact, so a snapshot built before
   satellites existed still reads correctly. */
const LOCAL_SAT = SNAP.local_satellite || "";
const SWITCH_HINT = "⇄ click an account to switch";
/* Hovering a Claude row lights every row of that account and rewrites the
   Anthropic header's hint into the exact thing a click will do. */
function hoverAccount(account) {
  for (const row of document.querySelectorAll(".reg-row.switchable")) {
    row.classList.toggle("account-hover", Boolean(account) && row.dataset.account === account.display);
  }
  const hint = document.querySelector(".switch-hint");
  if (!hint) return;
  if (!account) {
    hint.textContent = SWITCH_HINT;
    hint.dataset.live = "";
  } else if (isHere(account)) {
    hint.textContent = `● ${account.display} in use here`;
    hint.dataset.live = "here";
  } else {
    hint.textContent = `⇄ switch to ${account.display}`;
    hint.dataset.live = "switch";
  }
}
const loginsOf = account => (account.logins && account.logins.length) ? account.logins
  : account.provider !== "Claude" ? []
  : (account.active ? [LOCAL_SAT || "here"] : []);
const isHere = account => LOCAL_SAT
  ? loginsOf(account).includes(LOCAL_SAT) : Boolean(account.active);
const isThere = account => loginsOf(account).some(name => name !== LOCAL_SAT);
const loginMarks = account => loginsOf(account).map(name =>
  (LOCAL_SAT ? name === LOCAL_SAT : true)
    ? `<span class="active">● ${escapeHTML(name)}</span>`
    : `<span class="active remote">◦ ${escapeHTML(name)}</span>`).join("");
const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
const endOf = window => window.resets_at ? Date.parse(window.resets_at) : null;
const startOf = window => window.resets_at && window.window_minutes
  ? endOf(window) - window.window_minutes * MIN : null;
const rolled = window => endOf(window) != null && endOf(window) < Date.now();
/* A window past its reset is advanced upstream (glideslope.roll_forward_windows).
   `presumed` means zeroed because nothing here could have spent it; `unread`
   means the clock is known and the burn is not. Never the same claim. */
const unread = window => window.used_percent == null && (window.rolled_periods || 0) > 0
  && Boolean(window.resets_at);
const leftMs = window => endOf(window) == null ? null : endOf(window) - Date.now();
const observedAge = account => {
  const observed = Date.parse(account.observed_at || "");
  return Number.isFinite(observed) ? Math.max(0, Date.now() - observed) : null;
};
const paceOf = window => {
  const start = startOf(window), end = endOf(window);
  if (start == null || end == null || window.used_percent == null) return null;
  return clamp((Date.now() - start) / (end - start) * 100, 0, 100);
};
const needMultiple = window => {
  const left = leftMs(window);
  if (left == null || left <= 0 || window.used_percent == null || !window.window_minutes) return null;
  return ((100 - window.used_percent) / 100 * window.window_minutes * MIN) / left;
};
/* When this window runs out if the rate it has burned so far simply continues —
   null when it does not run out before the reset, which is a different and
   perfectly good outcome, not a missing value. */
const exhaustAt = window => {
  const start = startOf(window);
  if (start == null || window.used_percent == null
      || window.used_percent <= 0 || window.used_percent >= 100 || rolled(window)) return null;
  const rate = window.used_percent / (Date.now() - start);
  if (!(rate > 0)) return null;
  const at = Date.now() + (100 - window.used_percent) / rate;
  return at < endOf(window) ? at : null;
};

/* Recent forecasts require an earlier timestamped sample in the requested
   span. A single current read can support the baseline, but it cannot honestly
   claim a 1h, 6h, or 24h burn rate. Each returned segment is only as long as

  const elapsed = e - baseE, used = u - baseU;

     account that had not moved: an account flat for a day drew no 6h or 24h line
     at all, leaving no way to tell "burning slowly" from "not burning". Zero is

     where it already is. Only a NEGATIVE change is rejected, which the sample
     filter above already makes impossible; the guard stays as a guard.

   exactly the window whose phase the ◆ plots: mean phase = (now − mean start)/span

      && (pool.accounts || []).includes(entry.account.display)

/* A five-hour read is only as good as the window it was observed in. Observed

     fresh (nothing here could have spent it), or unread (no number offered) */
  if (window.presumed) return { unknown: false, lastKnown: false };
  if (unread(window)) return { unknown: true, lastKnown: false };

     fact, not a gap, and calling it unknown invents an ignorance the gauge does
     not have. A stale account cannot make the claim, so there it stays unknown. */

/* ── the approach plot ──
   The deck's frame, refitted for the host panel. Both axes are percent of the

   it is spending faster than the clock, below it is holding capacity back. The

   differently, so they never wear the same symbol: solid line + triangle = 7 DAY

   The pooled read is all of Claude summed — not an account, not a provider row —

    const inner = radius * .17, outer = radius * CLAUDE_RAY_LENGTHS[i];

          + ` y2="${(c + Math.sin(angle) * outer).toFixed(2)}"/>`;

function plotEntries() {
